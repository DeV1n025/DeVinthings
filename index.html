<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Vorschaubilder - Kacheln</title>
  <link rel="stylesheet" href="theme.css" />
  <script src="language.js"></script>
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: radial-gradient(1200px 800px at 20% 0%, var(--bg-glow) 0%, transparent 60%),
                  radial-gradient(1000px 700px at 90% 10%, var(--bg-glow-alt) 0%, transparent 55%),
                  var(--bg);
      color: var(--text);
      font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial, "Noto Sans", "Liberation Sans", sans-serif;
      min-height: 100vh;
    }

    .toolbar-frame {
      display: block;
      width: 100%;
      height: 62px;
      border: 0;
      position: relative;
      z-index: 10;
      box-shadow: var(--toolbar-shadow);
      background: var(--bg);
    }

    .wrap {
      max-width: 1200px;
      margin: 0 auto;
      padding: 16px;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 14px;
      align-items: stretch;
    }

    .card {
      background: var(--card-bg);
      border: 1px solid var(--stroke);
      border-radius: var(--radius);
      overflow: hidden;
      box-shadow: var(--shadow);
      transition: transform 140ms ease, border-color 140ms ease, background 140ms ease;
      display: flex;
      flex-direction: column;
      min-height: 190px;
    }

    .card:hover {
      transform: translateY(-3px);
      border-color: var(--accent);
      background: var(--panel2);
    }

.thumb {
      /* Responsiv: statt fester Höhe ein Seitenverhältnis */
      width: 100%;
      aspect-ratio: 16 / 9;
      background: var(--thumb-bg);
      display: grid;
      place-items: center;
      overflow: hidden;
      border-bottom: 1px solid var(--stroke);
    }



    .thumb img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .content {
      padding: 12px 12px 14px;
      display: flex;
      flex-direction: column;
      gap: 6px;
      flex: 1;
    }

    .title {
      font-weight: 750;
      font-size: 14px;
      line-height: 1.2;
      letter-spacing: 0.2px;
      display: -webkit-box;
      -webkit-line-clamp: 1;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .url {
      font-size: 12px;
      color: var(--muted);
      line-height: 1.3;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
      word-break: break-word;
    }

    .card:focus-visible {
      outline: 3px solid rgba(127,90,240,0.6);
      outline-offset: 2px;
    }
  </style>
</head>

  <script>
    (function () {
      const storedTheme = localStorage.getItem('theme') || 'dark';
      const toolbarFrame = document.getElementById('toolbar-frame');
      function applyTheme(theme) {
        if (theme !== 'light' && theme !== 'dark') return;
        document.documentElement.dataset.theme = theme;
      }

      function applyToolbarHeight(height) {
        if (Number.isFinite(height) && height > 0) {
          toolbarFrame.style.height = Math.ceil(height) + 'px';
        }
      }

      applyTheme(storedTheme);
      Language.apply(Language.get());

      toolbarFrame.addEventListener('load', function () {
        const toolbar = toolbarFrame.contentDocument.querySelector('.toolbar');
        if (toolbar) applyToolbarHeight(toolbar.getBoundingClientRect().height);
        toolbarFrame.contentWindow.postMessage({
          type: 'theme-state',
          theme: document.documentElement.dataset.theme
        }, '*');
        toolbarFrame.contentWindow.postMessage({
          type: 'language-state',
          language: Language.get()
        }, '*');
      });

      window.addEventListener('message', function (event) {
        if (event.data && event.data.type === 'toolbar-height') {
          applyToolbarHeight(Number(event.data.height));
          return;
        }

        if (event.data && event.data.type === 'language-change') {
          Language.set(event.data.language);
          return;
        }

        if (!event.data || event.data.type !== 'theme-change') return;
        if (event.data.theme !== 'light' && event.data.theme !== 'dark') return;
        applyTheme(event.data.theme);
        localStorage.setItem('theme', event.data.theme);
      });

      window.addEventListener('storage', function (event) {
        if (event.key === 'theme') applyTheme(event.newValue);
        if (event.key === 'language') Language.apply(event.newValue);
      });

      const cards = document.querySelectorAll('.card[data-url]');
      function openInNewTab(url) {
        window.open(url, '_blank', 'noopener,noreferrer');
      }

      cards.forEach(card => {
        const url = card.getAttribute('data-url');

        card.addEventListener('click', () => openInNewTab(url));
        card.addEventListener('keydown', (e) => {
          if (e.key === 'Enter' || e.key === ' ') {
            e.preventDefault();
            openInNewTab(url);
          }
        });
      });
    })();
  </script>
